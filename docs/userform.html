<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiRisk Dashboard - Access</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/userform.css">
</head>
<body>
    <div class="auth-container">
       <div class="auth-card">
            <!--Login for selection login or register-->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">
                    -- Login --
                </button>
                <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">
                    -- Register --
                </button>
            </div>

            <!--Login-->
            <div class="form-panel active" id="panelLogin">
                <form id="loginForm">
                    <div class="form-group">
                        <label> Email: </label>
                        <input type="email" id="loginEmail" placeholder="youremail@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label> Password: </label>
                        <input type="password" id="loginPassword" placeholder="Password" required />
                    </div>

                    <button class="btn-submit" type="submit">Login</button>
                    
                    <div class="message" id="loginMsg"></div>
                </form>
            </div>

            <!--Register-->
            <div class="form-panel" id="panelRegister">
                <form id="registerForm">   
                    <div class="form-group">
                        <label> Email: </label>
                        <input type="email" id="regEmail" placeholder="youremail@gmail.com" required />
                    </div>

                    <div class="form-group">
                        <label> Password: </label>
                        <input type="password" id="regPassword" placeholder="Password" required />
                    </div>

                    <button class="btn-submit" type="submit">Register</button>

                    <div class="message" id="registerMsg"></div>
                </form>
            </div>

       </div>
    </div>
</body>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/auth.js"></script>

</html>
